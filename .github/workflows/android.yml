name: Build TNGQuickAlert

on:
  workflow_dispatch:
  push:
    paths:
      - 'TNGQuickAlert-project-fixed.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q TNGQuickAlert-project-fixed.zip

      - name: Build APK
        run: gradle -p TNGQuickAlert assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TNGQuickAlert-APK
          path: TNGQuickAlert/app/build/outputs/apk/debug/app-debug.apk
